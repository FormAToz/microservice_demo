version: '2.1'

services:
  database:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: "fstock_dev"
    volumes:
      - ./V1_0_0__init_tables.sql:/docker-entrypoint-initdb.d/1-V1_0_0__init_tables.sql
      - ./V1_0_1__add_data.sql:/docker-entrypoint-initdb.d/2-V1_0_1__add_data.sql
    networks:
      backend:
        aliases:
          - database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  config-server:
    image: config-server:latest
    container_name: config-server
    ports:
      - "8071:8071"
    networks:
      backend:
        aliases:
          - config-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8071/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  license-service:
    image: license-service:latest
    container_name: license-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - license-service

  organization-service:
    image: organization-service:latest
    container_name: organization-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - organization-service

  eureka-server:
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8070:8070"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - eureka-server

  gw-server:
    image: gw-server:latest
    container_name: gw-server
    ports:
      - "8072:8072"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - gw-server

networks:
  backend:
    driver: bridge
